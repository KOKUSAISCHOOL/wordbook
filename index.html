<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#f3f5f8">

    <title>고쿠사이 일본어 단어장</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">

        <!-- 주차 목록 화면 -->
        <section id="week-screen">

            <header class="main-header">
                <h1>고쿠사이 일본어 단어장</h1>
                <p>학습할 주차를 선택하세요.</p>
            </header>

            <div class="week-top-menu">
                <span></span>

                <button
                    id="main-favorite-button"
                    class="main-favorite-button"
                    type="button"
                >
                    ★ 즐겨찾기
                </button>
            </div>

            <div id="week-list" class="week-list">
                데이터를 불러오는 중입니다.
            </div>

        </section>


        <!-- 단어 학습 화면 -->
        <section id="study-screen" class="hidden">

            <div class="study-top-row">

            <div class="study-top-left">
        
                <button
                    id="back-button"
                    class="top-menu-button"
                    type="button"
                >
                    ← 주차 목록
                </button>
        
                <button
                    id="naver-dictionary-button"
                    class="naver-dictionary-button"
                    type="button"
                >
                    네이버사전
                </button>
        
            </div>
        
            <button
                id="favorite-list-button"
                class="top-menu-button"
                type="button"
            >
                즐겨찾기
            </button>
        
        </div>

            <header class="study-header">

                <h2 id="week-title"></h2>

                <p class="progress">
                    <span id="current-number">1</span>
                    /
                    <span id="total-number">0</span>
                </p>

            </header>


            <!-- 카드 바깥 영역 -->
            <div class="word-card-wrapper">

                <!-- 단어 즐겨찾기 버튼 -->
                <button
                    id="favorite-button"
                    class="favorite-button"
                    type="button"
                    aria-label="즐겨찾기 추가"
                    title="즐겨찾기 추가"
                >
                    ☆
                </button>

                <!-- 카드 클릭 영역 -->
                <button
                    id="card-content"
                    class="word-card"
                    type="button"
                >
                    <span class="card-guide">
                        카드를 누르면 정답이 표시됩니다.
                    </span>

                    <span id="kanji" class="kanji"></span>

                    <span
                        id="answer-area"
                        class="answer-area hidden-answer"
                    >
                        <span id="hiragana" class="hiragana"></span>
                        <span id="meaning" class="meaning"></span>
                    </span>
                </button>

            </div>


            <div class="button-row">

                <button
                    id="previous-button"
                    type="button"
                >
                    이전
                </button>

                <button
                    id="next-button"
                    class="primary-button"
                    type="button"
                >
                    다음
                </button>

            </div>

            <button
                id="shuffle-button"
                class="wide-button"
                type="button"
            >
                단어 순서 섞기
            </button>

        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
